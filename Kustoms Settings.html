<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kustoms Settings</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { display: block; width: 100%; margin: 10px 0; padding: 8px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Kustoms Settings</h1>
        <label>Default Sprite Name</label>
        <input type="text" id="spriteName" placeholder="Enter sprite name">
        
        <label>Custom Sprite SVG URL</label>
        <input type="text" id="spriteUrl" placeholder="https://example.com/sprite.svg">
        
        <button onclick="saveSettings()">Save Settings</button>
    </div>

    <script>
        function saveSettings() {
            const config = {
                spriteName: document.getElementById('spriteName').value,
                spriteUrl: document.getElementById('spriteUrl').value
            };
            localStorage.setItem('kustoms_config', JSON.stringify(config));
            alert('Settings saved! Please reload the editor.');
        }

        // Charger les valeurs existantes
        window.onload = () => {
            const saved = JSON.parse(localStorage.getItem('kustoms_config') || '{}');
            if(saved.spriteName) document.getElementById('spriteName').value = saved.spriteName;
            if(saved.spriteUrl) document.getElementById('spriteUrl').value = saved.spriteUrl;
        };
    </script>
</body>
</html>
