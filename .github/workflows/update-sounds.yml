name: Update Sounds Library (MD5 Edition)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write # Obligatoire pour modifier le JSON

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scratch-gui
        uses: actions/checkout@v4
        with:
          repository: 'Stormwindsky/scratch-gui'
          ref: 'develop'
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # Récupère tout l'historique pour éviter les erreurs de push

      - name: Fetch, Hash and Update JSON
        shell: python
        run: |
          import json
          import requests
          import hashlib
          import os

          sources = [
              "https://api.github.com/repos/Stormwindsky/OeuvreLibre/contents/ArtLibre/ArtLibre/files",
              "https://api.github.com/repos/Stormwindsky/Assets-under-license-CC0-1.0-for-StormWarp/contents/Assets"
          ]
          
          json_path = "src/lib/libraries/sounds.json"
          
          # Chargement sécurisé du JSON
          if os.path.exists(json_path):
              with open(json_path, 'r', encoding='utf-8') as f:
                  try:
                      sounds_data = json.load(f)
                  except:
                      sounds_data = []
          else:
              sounds_data = []

          existing_md5s = {s['md5ext'] for s in sounds_data if 'md5ext' in s}
          new_count = 0

          for api_url in sources:
              print(f"Scanning: {api_url}")
              resp = requests.get(api_url)
              if resp.status_code != 200: continue
              
              for item in resp.json():
                  if item['name'].endswith('.wav'):
                      # Récupération du hash MD5 réel
                      content = requests.get(item['download_url']).content
                      md5hash = hashlib.md5(content).hexdigest()
                      md5ext = f"{md5hash}.wav"

                      if md5ext not in existing_md5s:
                          sounds_data.append({
                              "name": item['name'].replace('.wav', ''),
                              "md5ext": md5ext,
                              "sampleCount": 0, 
                              "rate": 44100,
                              "format": "",
                              "tags": ["library"]
                          })
                          existing_md5s.add(md5ext)
                          new_count += 1

          if new_count > 0:
              with open(json_path, 'w', encoding='utf-8') as f:
                  json.dump(sounds_data, f, indent=4, ensure_ascii=False)
              print(f"Added {new_count} sounds.")

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/libraries/sounds.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "feat: sync sounds library (GPL compliance)"
            git push origin develop
          fi
