name: Deploy TurboWarp
on:
  push:
    branches: [ "develop" ]
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build # Le dossier que TurboWarp crée après le build
          branch: gh-pages # C'est ici que le robot va créer la branche magique
