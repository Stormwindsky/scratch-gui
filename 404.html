<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Spark Lost in the Clouds</title>
    <style>
        :root {
            --electric-blue: #00f2ff;
            --dragon-gold: #ffd700;
            --bg-dark: #1a1a2e;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #error-container {
            transition: transform 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045), opacity 0.5s;
            z-index: 2;
        }

        .falling {
            transform: translateY(120vh) rotate(20deg);
            opacity: 0;
        }

        .mascot {
            width: 250px;
            filter: drop-shadow(0 0 15px var(--electric-blue));
            margin-bottom: 20px;
        }

        h1 {
            font-size: 3rem;
            margin: 10px 0;
            color: var(--dragon-gold);
            text-shadow: 2px 2px 10px rgba(255, 215, 0, 0.5);
        }

        p {
            font-size: 1.2rem;
            color: #a0a0c0;
        }

        .hint {
            margin-top: 30px;
            font-size: 0.9rem;
            opacity: 0.6;
            border: 1px dashed var(--electric-blue);
            padding: 5px 10px;
            display: inline-block;
        }

        /* Game Iframe Styling */
        #game-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 90vw;
            height: 80vh;
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1;
        }

        #game-wrapper.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 3px solid var(--dragon-gold);
            border-radius: 15px;
            box-shadow: 0 0 30px var(--electric-blue);
        }

        /* Lightning effect background */
        .lightning {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes flash {
            0% { opacity: 0; }
            10% { opacity: 0.3; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="lightning" id="flash"></div>

    <div id="error-container">
        <img src="https://raw.githubusercontent.com/Stormwindsky/OeuvreLibre/refs/heads/main/ArtLibre/ArtLibre/files/Znak%20the%20Dragon%20Snake%20(ded%20version).svg" 
             alt="Znak the Dragon Snake" class="mascot">
        
        <h1>Whoops! A Short Circuit Occurred</h1>
        <p>Znak is scratching its head... This page has vanished into thin air.</p>
        <p>Double check the URL or head back to safety.</p>
        
        <div class="hint">Is there a spark in the air? Try pressing [Space]</div>
    </div>

    <div id="game-wrapper">
        <iframe id="game-iframe" src="" frameborder="0"></iframe>
    </div>

    <script>
        let gameLaunched = false;

        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space' && !gameLaunched) {
                gameLaunched = true;
                launchEasterEgg();
            }
        });

        function launchEasterEgg() {
            const container = document.getElementById('error-container');
            const gameWrapper = document.getElementById('game-wrapper');
            const iframe = document.getElementById('game-iframe');
            const flash = document.getElementById('flash');

            // 1. Flash effect
            flash.style.animation = "flash 0.2s ease-out";

            // 2. Error message falls down
            container.classList.add('falling');

            // 3. Load and show the game
            setTimeout(() => {
                iframe.src = "https://www.stormwindsky.com/Games/Vector%20Volley/Vector%20Volley.html";
                gameWrapper.classList.add('active');
                container.style.display = 'none';
            }, 400);
        }
    </script>
</body>
</html>
