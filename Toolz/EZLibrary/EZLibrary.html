<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZLibrary by Stormwindsky</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #1a1a1a;
            --card: #2d2d2d;
            --text: #ffffff;
            --accent: #00d1b2;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background-color: var(--card);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        .header { margin-bottom: 20px; }
        .license { font-size: 0.8rem; color: #888; margin-top: 10px; }
        
        .drop-zone {
            border: 3px dashed var(--accent);
            padding: 40px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        .drop-zone.dragover { background: rgba(0, 209, 178, 0.2); border-color: #fff; }

        .config-section {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            background: #444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.2s;
        }
        .btn.active { background: var(--accent); }
        
        #output-area {
            width: 100%;
            height: 200px;
            background: #000;
            color: #0f0;
            font-family: monospace;
            border-radius: 5px;
            padding: 10px;
            margin-top: 20px;
            white-space: pre-wrap;
            overflow-y: auto;
            text-align: left;
            font-size: 0.8rem;
        }

        .copy-btn {
            margin-top: 10px;
            background: var(--accent);
            font-weight: bold;
        }

        .hidden { display: none; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🌪️ EZLibrary</h1>
            <p>📁 (.sb3 / .json) ➡️ 📜 .json</p>
        </div>

        <div class="config-section">
            <button class="btn mode-btn" data-mode="backdrops" title="Backdrops">🖼️</button>
            <button class="btn mode-btn" data-mode="costumes" title="Costumes">👕</button>
            <button class="btn mode-btn" data-mode="audios" title="Audios">🔊</button>
        </div>

        <div class="drop-zone" id="drop-zone">
            📤 🧊 (.sb3) / 📜 (.json)
            <input type="file" id="file-input" accept=".sb3,.json" multiple>
        </div>

        <div id="status">⚠️ ➡️ ⚙️</div>

        <div class="hidden" id="result-container">
            <textarea id="output-area" readonly></textarea>
            <button class="btn copy-btn" id="copy-btn">📋</button>
        </div>

        <div class="license">⚖️ GPL-3.0 License | Created by Stormwindsky</div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const outputArea = document.getElementById('output-area');
        const resultContainer = document.getElementById('result-container');
        const copyBtn = document.getElementById('copy-btn');
        const status = document.getElementById('status');
        const modeButtons = document.querySelectorAll('.mode-btn');

        let selectedMode = null;
        let existingData = [];

        modeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                modeButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedMode = btn.getAttribute('data-mode');
                status.innerText = "✅ " + btn.innerText;
            });
        });

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        async function handleFiles(files) {
            for (const file of files) {
                if (file.name.toLowerCase().endsWith('.json')) {
                    await loadJson(file);
                } else if (file.name.toLowerCase().endsWith('.sb3')) {
                    await processSb3(file);
                }
            }
        }

        function loadJson(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        existingData = JSON.parse(e.target.result);
                        status.innerText = "📜 ✅ (" + existingData.length + ")";
                    } catch (err) { alert("❌ JSON Error"); }
                    resolve();
                };
                reader.readAsText(file);
            });
        }

        async function processSb3(file) {
            if (!selectedMode) {
                alert("⚠️ Select 🖼️ / 👕 / 🔊 !");
                return;
            }

            status.innerText = "⏳ ⚙️...";
            const zip = new JSZip();
            
            try {
                const content = await zip.loadAsync(file);
                let newEntries = [...existingData];
                let addedCount = 0;

                let allowedExt = (selectedMode === 'audios') 
                    ? ['wav', 'mp3', 'ogg'] 
                    : ['svg', 'png', 'jpg', 'jpeg', 'bmp'];

                for (let filename in content.files) {
                    const parts = filename.split('.');
                    const ext = parts.pop().toLowerCase();
                    const md5ext = filename;

                    if (allowedExt.includes(ext)) {
                        const isDuplicate = existingData.some(item => item.md5ext === md5ext);

                        if (!isDuplicate) {
                            const assetId = parts.join('.');
                            let entry = {
                                "name": assetId,
                                "assetId": assetId,
                                "dataFormat": ext,
                                "md5ext": md5ext
                            };

                            if (selectedMode === 'audios') {
                                entry.rate = 44100;
                                entry.sampleCount = 0;
                            } else {
                                entry.bitmapResolution = (ext === 'svg') ? 1 : 2;
                                entry.rotationCenterX = 0;
                                entry.rotationCenterY = 0;
                            }
                            newEntries.push(entry);
                            addedCount++;
                        }
                    }
                }

                outputArea.value = JSON.stringify(newEntries, null, 4);
                resultContainer.classList.remove('hidden');
                status.innerText = `✅ +${addedCount} | Total: ${newEntries.length}`;
            } catch (err) {
                status.innerText = "❌ Error .sb3";
            }
        }

        copyBtn.addEventListener('click', () => {
            outputArea.select();
            document.execCommand('copy');
            const old = copyBtn.innerText;
            copyBtn.innerText = "✅";
            setTimeout(() => copyBtn.innerText = old, 2000);
        });
    </script>
</body>
</html>
